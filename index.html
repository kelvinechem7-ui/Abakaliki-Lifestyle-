<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Abakaliki Lifestyle</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
  touch-action: none;
}

canvas {
  display: block;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 5;
  pointer-events: none;
}

.panel {
  color: white;
  background: rgba(0,0,0,.75);
  padding: 10px 13px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.7;
}

#title {
  font-weight: bold;
  color: #ffd700;
  font-size: 15px;
}

#controls {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 6;
}

#stick {
  position: absolute;
  left: 25px;
  bottom: 35px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: rgba(0,0,0,.30);
  border: 2px solid rgba(255,255,255,.7);
  pointer-events: auto;
  touch-action: none;
}

#knob {
  position: absolute;
  left: 37px;
  top: 37px;
  width: 47px;
  height: 47px;
  border-radius: 50%;
  background: rgba(255,255,255,.85);
  box-shadow: 0 2px 8px #222;
}

.btn {
  position: absolute;
  pointer-events: auto;
  border: 2px solid rgba(255,255,255,.8);
  border-radius: 50%;
  color: white;
  font-weight: bold;
  background: rgba(0,0,0,.65);
  width: 67px;
  height: 67px;
  font-size: 11px;
  touch-action: none;
}

#action {
  right: 25px;
  bottom: 38px;
  background: #087f23;
}

#brake {
  right: 103px;
  bottom: 116px;
  background: #b71c1c;
}

#camera {
  right: 20px;
  top: 95px;
  width: 85px;
  height: 43px;
  border-radius: 10px;
  background: #164e9b;
}

#enter {
  right: 20px;
  top: 145px;
  width: 85px;
  height: 43px;
  border-radius: 10px;
  background: #a45b00;
}

#message {
  position: fixed;
  left: 50%;
  top: 48%;
  transform: translate(-50%,-50%);
  padding: 12px 16px;
  color: white;
  background: rgba(0,0,0,.8);
  border-radius: 10px;
  font-size: 14px;
  z-index: 10;
  display: none;
  text-align: center;
}

@media (max-width: 380px) {
  #stick {
    width: 108px;
    height: 108px;
  }

  #knob {
    left: 30px;
    top: 30px;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="hud">
  <div class="panel">
    <div id="title">ABAKALIKI LIFESTYLE</div>
    <div id="mode">Mode: Walking</div>
    <div id="money">Money: ₦1,000</div>
    <div id="speed">Speed: 0 km/h</div>
  </div>

  <div class="panel">
    OPEN WORLD<br>
    <span style="color:#8effa1">Explore the city</span>
  </div>
</div>

<div id="controls">
  <div id="stick">
    <div id="knob"></div>
  </div>

  <button class="btn" id="action">ACTION</button>
  <button class="btn" id="brake">BRAKE</button>
  <button class="btn" id="camera">CAMERA</button>
  <button class="btn" id="enter">ENTER CAR</button>
</div>

<div id="message"></div>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91d5ff);
scene.fog = new THREE.Fog(0x91d5ff, 100, 350);

const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth / window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(40, 80, 30);
scene.add(sunlight);

const material = (color, roughness = 0.9) =>
  new THREE.MeshStandardMaterial({ color, roughness });

const grassMat = material(0x48a447);
const roadMat = material(0x333840);
const lineMat = material(0xffffff);
const sidewalkMat = material(0xb9b9b9);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(700, 700),
  grassMat
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.12;
scene.add(ground);

function box(w,h,d,color,x,y,z,parent=scene) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material(color)
  );
  mesh.position.set(x,y,z);
  parent.add(mesh);
  return mesh;
}

// City roads
box(16,0.1,650,0x333840,0,0,0);
box(650,0.1,16,0x333840,0,0,0);

// Road lane markings
for (let i=-300; i<300; i+=18) {
  box(0.22,0.03,7,0xffdf64,0,0.07,i);
  box(7,0.03,0.22,0xffffff,i,0.07,0);
}

// Sidewalks
box(4,0.25,650,0xb9b9b9,-10,0,0);
box(4,0.25,650,0xb9b9b9,10,0,0);
box(650,0.25,4,0xb9b9b9,0,0,-10);
box(650,0.25,4,0xb9b9b9,0,0,10);

// Buildings
const buildingColors = [
  0xe9d6b5, 0xf2eee5, 0xe6ad79,
  0xc8d8e8, 0xd7c5a5, 0xd9e5ce,
  0xc4c4c4, 0xf0c8bc
];

function building(x,z) {
  const w = 8 + Math.random()*9;
  const d = 8 + Math.random()*9;
  const h = 7 + Math.random()*24;
  const color = buildingColors[
    Math.floor(Math.random()*buildingColors.length)
  ];

  box(w,h,d,color,x,h/2,z);

  // Roof
  box(w+0.3,0.35,d+0.3,0x777777,x,h+0.15,z);

  // Windows on front
  const windowMat = material(0x8ed8f4,0.35);

  for(let yy=2; yy<h-1; yy+=3) {
    for(let xx=-w/2+1.2; xx<w/2-0.5; xx+=2.4) {
      const win = new THREE.Mesh(
        new THREE.BoxGeometry(1.1,1.3,0.08),
        windowMat
      );
      win.position.set(x+xx,yy,z+d/2+0.05);
      scene.add(win);
    }
  }

  // Shop sign
  if(Math.random() > 0.45) {
    box(w*0.75,1.1,0.18,0x1459a8,x,h*0.25,z+d/2+0.12);
  }
}

// Keep the roads clear
for(let x=-70; x<=70; x+=24) {
  for(let z=-70; z<=70; z+=24) {
    if(Math.abs(x)<18 || Math.abs(z)<18) continue;
    building(x,z);
  }
}

for(let x=-170; x<=170; x+=28) {
  for(let z=-170; z<=170; z+=28) {
    if(Math.abs(x)<90 && Math.abs(z)<90) continue;
    if(Math.random()>0.28) building(x,z);
  }
}

// Trees
function tree(x,z) {
  box(0.7,3,0.7,0x79512e,x,1.5,z);

  const crown = new THREE.Mesh(
    new THREE.SphereGeometry(2.1,7,6),
    material(0x237c35)
  );
  crown.position.set(x,4,z);
  scene.add(crown);
}

for(let x=-160; x<=160; x+=20) {
  tree(x,-14);
  tree(x,14);
  tree(-14,x);
  tree(14,x);
}

// Human placeholder
// Replace this with a proper rigged human model in a later upgrade.
const player = new THREE.Group();
scene.add(player);

const skin = material(0x8d5738);
const shirt = material(0x1763b0);
const trousers = material(0x252b35);
const shoes = material(0x171717);

const body = new THREE.Mesh(
  new THREE.CylinderGeometry(0.38,0.48,1.25,8),
  shirt
);
body.position.y=1.55;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.34,12,10),
  skin
);
head.position.y=2.45;
player.add(head);

const legs = [];

for(let side of [-1,1]) {
  const leg = new THREE.Mesh(
    new THREE.BoxGeometry(0.27,0.85,0.32),
    trousers
  );
  leg.position.set(side*0.2,0.48,0);
  player.add(leg);
  legs.push(leg);

  const foot = new THREE.Mesh(
    new THREE.BoxGeometry(0.3,0.16,0.43),
    shoes
  );
  foot.position.set(side*0.2,0.09,-0.04);
  player.add(foot);
}

player.position.set(0,0,5);

// Drivable car
const car = new THREE.Group();
scene.add(car);
car.position.set(5,0,0);

const carBody = new THREE.Mesh(
  new THREE.BoxGeometry(2.3,0.75,4.3),
  material(0xd52222,0.35)
);
carBody.position.y=0.75;
car.add(carBody);

const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.65,0.8,2),
  material(0x252d38,0.3)
);
cabin.position.set(0,1.45,-0.25);
car.add(cabin);

// Windscreen
const glass = material(0x80c9e8,0.25);
const windscreen = new THREE.Mesh(
  new THREE.BoxGeometry(1.5,0.55,0.08),
  glass
);
windscreen.position.set(0,1.48,0.78);
car.add(windscreen);

// Headlights and rear lights
for(const side of [-1,1]) {
  box(0.45,0.22,0.08,0xffffd0,side*0.72,0.78,2.17,car);
  box(0.4,0.22,0.08,0xff2222,side*0.72,0.78,-2.17,car);
}

// Wheels
const wheels=[];

for(const x of [-1.15,1.15]) {
  for(const z of [-1.35,1.35]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.43,0.43,0.28,12),
      material(0x171717)
    );
    wheel.rotation.z=Math.PI/2;
    wheel.position.set(x,0.43,z);
    car.add(wheel);
    wheels.push(wheel);
  }
}

// Game state
let money = 1000;
let driving = false;
let firstPerson = false;
let carSpeed = 0;
let heading = 0;
let walkHeading = 0;
let joyX = 0;
let joyY = 0;
let brakePressed = false;
let actionPressed = false;
let walkTime = 0;

const modeText = document.getElementById('mode');
const moneyText = document.getElementById('money');
const speedText = document.getElementById('speed');
const message = document.getElementById('message');

function notify(text) {
  message.textContent=text;
  message.style.display='block';
  clearTimeout(notify.timer);
  notify.timer=setTimeout(()=>{
    message.style.display='none';
  },2200);
}

// Mobile joystick
const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let stickPointer=null;

function moveStick(e) {
  const r=stick.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;
  let dx=e.clientX-cx;
  let dy=e.clientY-cy;
  const max=r.width*0.32;
  const len=Math.hypot(dx,dy);

  if(len>max) {
    dx=dx/len*max;
    dy=dy/len*max;
  }

  joyX=dx/max;
  joyY=dy/max;

  knob.style.transform=`translate(${dx}px,${dy}px)`;
}

stick.addEventListener('pointerdown',e=>{
  stickPointer=e.pointerId;
  stick.setPointerCapture(e.pointerId);
  moveStick(e);
});

stick.addEventListener('pointermove',e=>{
  if(e.pointerId===stickPointer) moveStick(e);
});

function resetStick() {
  stickPointer=null;
  joyX=0;
  joyY=0;
  knob.style.transform='translate(0px,0px)';
}

stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);

// Enter and exit car
document.getElementById('enter').addEventListener('click',()=>{
  if(!driving) {
    const distance=player.position.distanceTo(car.position);

    if(distance<7) {
      driving=true;
      player.visible=false;
      carSpeed=0;
      notify('You entered the car!');
    } else {
      notify('Walk closer to the red car first.');
    }
  } else {
    driving=false;
    carSpeed=0;

    player.visible=true;
    player.position.set(
      car.position.x+Math.cos(heading)*3,
      0,
      car.position.z+Math.sin(heading)*3
    );

    notify('You exited the car.');
  }

  updateHUD();
});

// Switch driving camera
document.getElementById('camera').addEventListener('click',()=>{
  firstPerson=!firstPerson;
  notify(firstPerson?'First-person camera':'Third-person camera');
});

// Action button
document.getElementById('action').addEventListener('pointerdown',()=>{
  actionPressed=true;
});

document.getElementById('action').addEventListener('pointerup',()=>{
  actionPressed=false;
});

document.getElementById('action').addEventListener('pointercancel',()=>{
  actionPressed=false;
});

// Brake button
document.getElementById('brake').addEventListener('pointerdown',()=>{
  brakePressed=true;
});

document.getElementById('brake').addEventListener('pointerup',()=>{
  brakePressed=false;
});

document.getElementById('brake').addEventListener('pointercancel',()=>{
  brakePressed=false;
});

function updateHUD() {
  modeText.textContent=driving?'Mode: Driving':'Mode: Walking';
  document.getElementById('enter').textContent=
    driving?'EXIT CAR':'ENTER CAR';
  document.getElementById('camera').style.display=
    driving?'block':'none';
  speedText.textContent=
    'Speed: '+Math.round(Math.abs(carSpeed)*18)+' km/h';
  moneyText.textContent='Money: ₦'+money.toLocaleString('en-NG');
}

let actionCooldown=0;

function updateGame(dt) {
  if(driving) {
    const throttle=-joyY;
    const steering=joyX;

    if(throttle>0.12) {
      carSpeed+=throttle*12*dt;
    } else if(throttle<-0.12) {
      carSpeed+=throttle*7*dt;
    } else {
      carSpeed*=Math.pow(0.985,dt*60);
    }

    if(brakePressed) {
      carSpeed*=Math.pow(0.90,dt*60);
    }

    carSpeed=THREE.MathUtils.clamp(carSpeed,-8,23);

    heading+=steering*carSpeed*0.055*dt;

    car.position.x+=Math.sin(heading)*carSpeed*dt;
    car.position.z+=Math.cos(heading)*carSpeed*dt;

    car.rotation.y=heading;

    wheels.forEach(w=>{
      w.rotation.x+=carSpeed*dt;
    });

    // Simple city boundary
    car.position.x=THREE.MathUtils.clamp(car.position.x,-300,300);
    car.position.z=THREE.MathUtils.clamp(car.position.z,-300,300);

  } else {
    const forward=-joyY;
    const sideways=joyX;

    if(Math.abs(forward)>0.08 || Math.abs(sideways)>0.08) {
      walkHeading=Math.atan2(sideways,forward);
      player.rotation.y=walkHeading;

      const speed=forward*7*dt;

      player.position.x+=Math.sin(walkHeading)*speed;
      player.position.z+=Math.cos(walkHeading)*speed;

      walkTime+=dt*12;

      legs[0].rotation.x=Math.sin(walkTime)*0.55;
      legs[1].rotation.x=-Math.sin(walkTime)*0.55;
    } else {
      legs.forEach(l=>l.rotation.x*=0.8);
    }

    player.position.x=THREE.MathUtils.clamp(player.position.x,-300,300);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-300,300);
  }

  if(actionPressed && actionCooldown<=0) {
    money+=100;
    actionCooldown=0.6;
    notify('You earned ₦100!');
  }

  actionCooldown-=dt;
  updateHUD();
}

const desiredCamera=new THREE.Vector3();
const lookTarget=new THREE.Vector3();

function updateCamera() {
  if(driving) {
    if(firstPerson) {
      desiredCamera.set(
        car.position.x+Math.sin(heading)*0.2,
        car.position.y+1.85,
        car.position.z+Math.cos(heading)*0.2
      );

      lookTarget.set(
        car.position.x+Math.sin(heading)*15,
        1.7,
        car.position.z+Math.cos(heading)*15
      );
    } else {
      desiredCamera.set(
        car.position.x-Math.sin(heading)*9,
        car.position.y+5.5,
        car.position.z-Math.cos(heading)*9
      );

      lookTarget.set(
        car.position.x,
        car.position.y+1,
        car.position.z
      );
    }
  } else {
    desiredCamera.set(
      player.position.x-Math.sin(player.rotation.y)*7,
      4.5,
      player.position.z-Math.cos(player.rotation.y)*7
    );

    lookTarget.set(
      player.position.x,
      1.5,
      player.position.z
    );
  }

  camera.position.lerp(desiredCamera,0.12);
  camera.lookAt(lookTarget);
}

let previous=performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const dt=Math.min((now-previous)/1000,0.04);
  previous=now;

  updateGame(dt);
  updateCamera();
  renderer.render(scene,camera);
}

camera.position.set(0,6,12);
updateHUD();
notify('Walk to the red car and tap ENTER CAR.');
requestAnimationFrame(animate);

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
    </html>
